name = "mnemion"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Keep runtime variables set outside this file (dashboard / `--var`) across
# deploys. WORKER_HOST lives there: each install names its own host, so it is
# never committed here, where a one-click fork would inherit someone else's.
keep_vars = true

# Pre-deploy build hook. Runs on every `wrangler deploy` (and in Workers Builds
# for one-click installs): ensures the Vectorize index exists (Vectorize is not
# auto-provisioned), then builds the render fragment bundle the worker imports.
[build]
command = "bash scripts/build-hook.sh"

# Static assets: the React SPA (dist/web). The runtime serves matching files
# before the worker; unmatched paths fall through to the worker, which serves
# the SPA shell for browser routes (see src/index.ts) and the API/MCP routes
# as before. binding = ASSETS lets the worker fetch index.html for that fallback.
[assets]
directory = "./dist/web"
binding = "ASSETS"


# Workers Logs — the lightweight, Cloudflare-native observability primitive.
# Ingests every console.* line for 7 days and (invocation_logs) attaches per-
# request metadata — method/url/status/outcome/rayId — automatically, so the
# code logs only the event + context (see shared/core/log.ts). No external sink,
# no tail worker, no Logpush. Without this block console output is not retained
# past a live `wrangler tail`, leaving nothing to read after an incident.
[observability]
enabled = true
  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

# WORKER_HOST (this instance's public host, e.g. mnemion.<you>.workers.dev) is
# authoritative for every generated URL (upload_url, page_url, og_image, the
# instance doc) and is set per install, not here: `npm run setup` sets it, or add
# it under the worker's Settings → Variables in the Cloudflare dashboard.
# Without it the instance fails closed and generates no links; the request's
# Host header is trusted only by local dev (DEV=true).

# KV namespace for OAuth tokens. No `id` → Cloudflare auto-provisions one named
# after the worker on first deploy and keeps it linked on later deploys. This is
# what lets a one-click "Deploy to Cloudflare" install work with no manual setup.
# (A local `wrangler deploy` writes the resolved id back into this file.)
[[kv_namespaces]]
binding = "OAUTH_KV"

# Session DO (McpAgent, one per MCP session)
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "SessionDO"

# Hive DO (per-user data storage)
[[durable_objects.bindings]]
name = "MNEMION_HIVE"
class_name = "HiveDO"

# Workers AI (embedding generation)
# remote = true: AI has no local simulator — dev/test reach the real binding.
# No effect on production deploys (bindings are always remote there).
[ai]
binding = "AI"
remote = true

# Vectorize (semantic search index)
# remote = true: required by the vitest pool (v0.16/miniflare) — Vectorize has no
# local support, so without this tests throw "Binding VECTORIZE needs to be run
# remotely". No effect on production deploys.
[[vectorize]]
binding = "VECTORIZE"
index_name = "mnemion-vectors"
remote = true

# Rate Limiting (GA) — operational cost/DoS guards on the public surfaces. Built-in,
# no provisioning. Enforced in code via router.ts `rateLimit`, which FAILS OPEN if a
# binding is absent; every deployed environment must declare both bindings.
# RL_INGRESS: the public WRITE surface (POST /i/:path) — every accepted write creates
# an entry + a billable Workers AI embedding + Vectorize upsert, so it's keyed per
# endpoint path to cap attacker-driven cost amplification regardless of source IP.
[[ratelimits]]
name = "RL_INGRESS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# RL_PUBLIC: the public READ surfaces (/o, /p, /marketplace) — keyed per client IP to
# cap cache-busting enumeration that bypasses the 60s edge cache and hits the DO.
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1002"
simple = { limit = 200, period = 60 }

# R2 bucket for document blobs (the bytes; metadata lives in the _documents pattern).
# OPTIONAL — the document store. Mnemion runs fully without it; only file
# upload/serve (/f) is unavailable until enabled. To turn it on:
#   1. Enable R2 on your account: Cloudflare dashboard → Storage & databases → R2.
#   2. Run `npm run enable-documents` — creates the bucket and uncomments the
#      block below for you. Then `npm run deploy`.
# A binding to a non-existent bucket fails deploy, so it ships commented
# out by default — that's what keeps Mnemion deployable without R2.
# [[r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "mnemion-documents"

# Migration: rename old class, add new ones
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CambiumServer"]

[[migrations]]
tag = "v2"
renamed_classes = [{from = "CambiumServer", to = "CambiumSession"}]
new_sqlite_classes = ["CambiumStore"]

[[migrations]]
tag = "v3"
renamed_classes = [{from = "CambiumSession", to = "SessionDO"}, {from = "CambiumStore", to = "StoreDO"}]

[[migrations]]
tag = "v4"
renamed_classes = [{from = "StoreDO", to = "HiveDO"}]

# === Test environment (federation peer) ===
# Optional. Used as a second hive for testing federation against the main env.
# Provision with: wrangler deploy --env test (and create its own OAUTH_KV namespace).
[env.test]
name = "mnemion-test"

# Named environments don't inherit top-level observability — redeclare it so the
# federation-peer/test deploy also retains logs.
[env.test.observability]
enabled = true
  [env.test.observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

# The test env's WORKER_HOST is set the same way (dashboard or --var).
# The deployed federation peer must also fail closed without MNEMION_SECRET.
# Use the local dev command for DEV=true; never publish owner auto-approval.

[env.test.assets]
directory = "./dist/web"
binding = "ASSETS"

# Named environments do not inherit AI or Vectorize. Keep the federation peer's
# embeddings isolated from production and from the CI test index.
[env.test.ai]
binding = "AI"
remote = true

[[env.test.vectorize]]
binding = "VECTORIZE"
index_name = "mnemion-test-vectors"
remote = true

# Named environments do not inherit rate-limit bindings. Keep separate
# namespaces so the federation peer has independent public request budgets.
[[env.test.ratelimits]]
name = "RL_INGRESS"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[env.test.ratelimits]]
name = "RL_PUBLIC"
namespace_id = "2002"
simple = { limit = 200, period = 60 }

[[env.test.kv_namespaces]]
binding = "OAUTH_KV"

[[env.test.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "SessionDO"

[[env.test.durable_objects.bindings]]
name = "MNEMION_HIVE"
class_name = "HiveDO"

# Document store — uncomment after enabling R2 (see the note in the default env).
# [[env.test.r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "mnemion-test-documents"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "HiveDO"]

# Import .md files as text modules
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Import .css as text (for inlining into server-rendered public-page HTML). Only
# worker-imported CSS hits this; the Vite web build handles its own CSS separately.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# Import compiled client bundles as text (for inlining into SSR HTML)
[[rules]]
type = "Text"
globs = ["**/*.client.txt"]
fallthrough = true

# Import font files as binary (ArrayBuffer) — fed to resvg for OG-card rendering.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false
